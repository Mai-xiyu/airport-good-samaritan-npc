name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.1"
        required: true
        default: "v1.4.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty."
          }

          $referenceRoot = (Resolve-Path "lib").Path
          $bepInExIl2Cpp = Join-Path $referenceRoot "BepInEx\core\BepInEx.Unity.IL2CPP.dll"
          $gameAssembly = Join-Path $referenceRoot "BepInEx\interop\Assembly-CSharp.dll"

          if (!(Test-Path $bepInExIl2Cpp) -or !(Test-Path $gameAssembly)) {
            throw "lib/BepInEx reference assemblies are missing."
          }

          dotnet build .\GoodSamaritanNpc.csproj -c Release /p:ReferenceRoot="$referenceRoot"
          Copy-Item .\bin\Release\GoodSamaritanNpc.dll .\dist\GoodSamaritanNpc.dll -Force
          Compress-Archive -Path @(
            ".\bin\Release\GoodSamaritanNpc.dll",
            ".\README.md"
          ) -DestinationPath ".\dist\GoodSamaritanNpc-$tag.zip" -Force

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\* --clobber
          } else {
            gh release create $tag .\dist\* --title $tag --generate-notes
          }
